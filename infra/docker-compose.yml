name: facoffee

services:
  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USUARIO_DB_PASSWORD: ${USUARIO_DB_PASSWORD}
      PARTICIPACAO_DB_PASSWORD: ${PARTICIPACAO_DB_PASSWORD}
      FINANCEIRO_DB_PASSWORD: ${FINANCEIRO_DB_PASSWORD}
      EXAMPLE_DB_PASSWORD: ${EXAMPLE_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # via TCP: o servidor temporário da inicialização só escuta no socket, então só fica saudável após o init.sh
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # a imagem não tem curl/wget; usa /dev/tcp do bash na porta de gestão
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Única porta aberta para fora do host (ADR 0007).
  gateway:
    image: traefik:v3.7
    ports:
      - "443:443"
    volumes:
      - ../gateway/traefik:/etc/traefik:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      gateway-auth:
        condition: service_healthy
      # Confere o acesso desativado em toda requisição (ADR 0011).
      usuario:
        condition: service_healthy

  # Verificador de token chamado pelo ForwardAuth do gateway.
  gateway-auth:
    build:
      context: ..
      dockerfile: templates/service/Dockerfile
      args:
        PACKAGE: "@facoffee/gateway"
    environment:
      # iss dos tokens emitidos ao navegador; o JWKS é buscado pela rede interna
      OIDC_ISSUER: http://localhost:8080/realms/facoffee
      OIDC_JWKS_URL: http://keycloak:8080/realms/facoffee/protocol/openid-connect/certs
      OIDC_CLIENT_ID: facoffee-web

  # Swagger UI de gateway/openapi.yaml, servido pelo gateway em /docs (ADR 0009).
  docs:
    image: swaggerapi/swagger-ui:v5.34.0
    environment:
      BASE_URL: /docs
      SWAGGER_JSON: /spec/openapi.yaml
      # Login no Authorize com o client do web (realm local).
      OAUTH_CLIENT_ID: facoffee-web
      OAUTH_USE_PKCE: "true"
    volumes:
      - ../gateway/openapi.yaml:/spec/openapi.yaml:ro

  # Sem porta publicada: só é alcançado pelo gateway (ADR 0007).
  usuario:
    build:
      context: ..
      dockerfile: templates/service/Dockerfile
      args:
        PACKAGE: "@facoffee/usuario"
    environment:
      SERVICE: user
      DATABASE_URL: postgres://usuario:${USUARIO_DB_PASSWORD}@postgres:5432/usuario
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  participacao:
    build:
      context: ..
      dockerfile: templates/service/Dockerfile
      args:
        PACKAGE: "@facoffee/participacao"
    environment:
      SERVICE: participation
      DATABASE_URL: postgres://participacao:${PARTICIPACAO_DB_PASSWORD}@postgres:5432/participacao
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  financeiro:
    build:
      context: ..
      dockerfile: templates/service/Dockerfile
      args:
        PACKAGE: "@facoffee/financeiro"
    environment:
      SERVICE: finance
      DATABASE_URL: postgres://financeiro:${FINANCEIRO_DB_PASSWORD}@postgres:5432/financeiro
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: financeiro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # Dispara os gatilhos de tempo de Participação a cada hora (ADR 0017). Sem servidor HTTP.
  agendador:
    build:
      context: ..
      dockerfile: templates/service/Dockerfile
      args:
        PACKAGE: "@facoffee/agendador"
    environment:
      PARTICIPACAO_URL: http://participacao:3000
    healthcheck:
      disable: true
    depends_on:
      participacao:
        condition: service_healthy

  # Template de serviço (templates/service); sobe só com --profile example.
  example:
    profiles: [example]
    build:
      context: ..
      dockerfile: templates/service/Dockerfile
    environment:
      SERVICE: example
      DATABASE_URL: postgres://example:${EXAMPLE_DB_PASSWORD}@postgres:5432/example
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq:
  postgres:
  seaweedfs:
