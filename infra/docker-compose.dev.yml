# Ambiente de desenvolvimento local (ADR 0003, ADR 0038). Só para desenvolvimento:
# credenciais fixas e PostgreSQL sem senha.
#   docker compose -f docker-compose.dev.yml up -d --wait --build
name: facoffee

services:
  # facoffee/facoffee; o usuário padrão guest só conecta de dentro do contêiner.
  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: facoffee
      RABBITMQ_DEFAULT_PASS: facoffee
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Sem senha (trust); um banco e um usuário por serviço, criados pelo init.sh.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # via TCP: o servidor temporário da inicialização só escuta no socket, então só fica saudável após o init.sh
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Portas do gateway nos redirects e origens do client facoffee-web (keycloak/facoffee-realm.json).
      GATEWAY_HTTP_PORT: ${GATEWAY_HTTP_PORT:-80}
      GATEWAY_HTTPS_PORT: ${GATEWAY_HTTPS_PORT:-443}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # a imagem não tem curl/wget; usa /dev/tcp do bash na porta de gestão
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: facoffee
      AWS_SECRET_ACCESS_KEY: facoffee-secret
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Único ponto aberto para fora do host (ADR 0007), em HTTPS e HTTP (ADR 0022).
  # Portas do host configuráveis, onde 80 e 443 não estão livres ou não são permitidas.
  gateway:
    image: traefik:v3.7
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ../gateway/traefik:/etc/traefik:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      gateway-auth:
        condition: service_healthy
      # Confere o acesso desativado em toda requisição (ADR 0011).
      usuario:
        condition: service_healthy

  # Verificador de token chamado pelo ForwardAuth do gateway.
  gateway-auth:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ../gateway
          ignore: [dist/, node_modules/, traefik/, openapi.yaml]
    environment:
      # iss dos tokens emitidos ao navegador; o JWKS é buscado pela rede interna
      OIDC_ISSUER: http://localhost:8080/realms/facoffee
      OIDC_JWKS_URL: http://keycloak:8080/realms/facoffee/protocol/openid-connect/certs
      OIDC_CLIENT_ID: facoffee-web

  # Swagger UI de gateway/openapi.yaml, servido pelo gateway em /docs (ADR 0009).
  docs:
    image: swaggerapi/swagger-ui:v5.34.0
    environment:
      BASE_URL: /docs
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ../gateway/openapi.yaml:/spec/openapi.yaml:ro

  # FACOFFEE web (build do Vite), servido pelo gateway em / (ADR 0021).
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ../web
          ignore: [dist/, node_modules/]

  # Sem porta publicada: só é alcançado pelo gateway (ADR 0007).
  usuario:
    build:
      context: ..
      dockerfile: services/usuario/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ../services/usuario
          ignore: [dist/, node_modules/]
    environment:
      SERVICE: user
      DATABASE_URL: postgres://usuario@postgres:5432/usuario
      RABBITMQ_URL: amqp://facoffee:facoffee@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  participacao:
    build:
      context: ..
      dockerfile: services/participacao/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ../services/participacao
          ignore: [dist/, node_modules/]
    environment:
      SERVICE: participation
      DATABASE_URL: postgres://participacao@postgres:5432/participacao
      RABBITMQ_URL: amqp://facoffee:facoffee@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  financeiro:
    build:
      context: ..
      dockerfile: services/financeiro/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ../services/financeiro
          ignore: [dist/, node_modules/]
    environment:
      SERVICE: finance
      DATABASE_URL: postgres://financeiro@postgres:5432/financeiro
      RABBITMQ_URL: amqp://facoffee:facoffee@rabbitmq:5672
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: facoffee
      S3_SECRET_KEY: facoffee-secret
      S3_BUCKET: financeiro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # E-mails no Mailpit (http://localhost:8025); em produção, SMTP do Gmail (ADR 0020).
  notificacao:
    build:
      context: ..
      dockerfile: services/notificacao/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ../services/notificacao
          ignore: [dist/, node_modules/]
    environment:
      SERVICE: notification
      DATABASE_URL: postgres://notificacao@postgres:5432/notificacao
      RABBITMQ_URL: amqp://facoffee:facoffee@rabbitmq:5672
      USUARIO_URL: http://usuario:3000
      FINANCEIRO_URL: http://financeiro:3000
      SMTP_URL: smtp://mailpit:1025
      SMTP_FROM: FACOFFEE <facoffee@localhost>
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Dispara os gatilhos de tempo de Participação e Notificação a cada hora (ADR 0017, ADR 0027).
  # Sem servidor HTTP.
  agendador:
    build:
      context: ..
      dockerfile: services/agendador/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ../services/agendador
          ignore: [dist/, node_modules/]
    environment:
      PARTICIPACAO_URL: http://participacao:3000
      NOTIFICACAO_URL: http://notificacao:3000
    depends_on:
      participacao:
        condition: service_healthy
      notificacao:
        condition: service_healthy

volumes:
  rabbitmq:
  postgres:
  seaweedfs:
