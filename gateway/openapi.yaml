openapi: 3.1.0
info:
  title: FACOFFEE API
  version: 0.1.0
  description: |
    API do FACOFFEE.

    Todas as rotas exigem autenticação. Para testar aqui, clique em **Authorize** e entre com
    usuário e senha (`login`) ou informe um access token (`bearer`). Usuário com acesso
    desativado recebe 403 em todas as rotas.
servers:
  - url: /
security:
  - login: [openid]
  - bearer: []
tags:
  - name: usuario
    description: Usuários
  - name: participacao
    description: Participação
paths:
  /api/usuario:
    get:
      tags: [usuario]
      operationId: listarUsuarios
      summary: Listar usuários
      description: |
        Usuários que já acessaram o FACOFFEE, em ordem de nome, indicando quem está com o acesso
        desativado. Só o gestor lista os usuários.
      responses:
        '200':
          description: Usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioRegistrado'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/usuario/eu:
    get:
      tags: [usuario]
      operationId: obterUsuarioLogado
      summary: Usuário logado
      description: Dados e perfis de acesso do usuário autenticado.
      responses:
        '200':
          description: Usuário logado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/usuario/{id}/desativacao:
    post:
      tags: [usuario]
      operationId: desativarAcesso
      summary: Desativar acesso
      description: |
        Desativa o acesso de um usuário ao FACOFFEE. O gestor desativa o acesso de qualquer
        pessoa; os demais, só o próprio. Desativar um acesso já desativado não tem efeito.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do usuário.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Acesso desativado.
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          description: Sem permissão para desativar o acesso de outra pessoa, ou acesso desativado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                semPermissao:
                  value:
                    error: sem-permissao
                acessoDesativado:
                  value:
                    error: acesso-desativado
        '404':
          description: Identificador inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: not-found
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/usuario/{id}/reativacao:
    post:
      tags: [usuario]
      operationId: reativarAcesso
      summary: Reativar acesso
      description: |
        Reativa o acesso de um usuário ao FACOFFEE. Só o gestor reativa. Reativar não devolve a
        participação: para voltar a participar, a pessoa pede a entrada de novo. Reativar um
        acesso ativo não tem efeito.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do usuário.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Acesso reativado.
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '404':
          description: Identificador inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: not-found
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/participacao/entrada:
    post:
      tags: [participacao]
      operationId: pedirEntrada
      summary: Pedir entrada e escolher tipo de cota
      description: |
        O usuário logado passa a participar da divisão dos custos da copa com o tipo de cota
        escolhido. Quem já saiu retorna pedindo a entrada de novo, com qualquer tipo de cota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoDeCota]
              properties:
                tipoDeCota:
                  $ref: '#/components/schemas/TipoDeCota'
      responses:
        '204':
          description: Entrada feita.
        '400':
          description: Tipo de cota ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: tipo-de-cota-invalido
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '409':
          description: O usuário já está participando.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: ja-participando
        '500':
          $ref: '#/components/responses/ErroInterno'
components:
  securitySchemes:
    login:
      type: oauth2
      description: Entrar com usuário e senha.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/realms/facoffee/protocol/openid-connect/auth
          tokenUrl: http://localhost:8080/realms/facoffee/protocol/openid-connect/token
          scopes:
            openid: Identificação do usuário
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtido ao entrar no FACOFFEE.
  responses:
    NaoAutorizado:
      description: Token ausente, inválido ou expirado.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: unauthorized
    AcessoDesativado:
      description: O acesso do usuário ao FACOFFEE foi desativado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: acesso-desativado
    SomenteGestor:
      description: Só o gestor pode fazer isso, ou acesso desativado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            semPermissao:
              value:
                error: sem-permissao
            acessoDesativado:
              value:
                error: acesso-desativado
    ErroInterno:
      description: Erro interno.
  schemas:
    Erro:
      type: object
      required: [error]
      properties:
        error:
          type: string
    TipoDeCota:
      type: string
      enum: [so-cafe, completa]
      description: |
        Tipo de cota: `so-cafe` dá direito ao café; `completa`, ao café, às bolachas, aos chás e
        aos demais itens da copa.
    Perfil:
      type: string
      enum: [gestor, participante]
      description: Perfil de acesso ao FACOFFEE.
    Usuario:
      type: object
      required: [id, nome, email, perfis]
      properties:
        id:
          type: string
          description: Identificador do usuário.
        nome:
          type: string
          description: Nome; vazio se não informado.
        email:
          type: string
          description: E-mail; vazio se não informado.
        perfis:
          type: array
          items:
            $ref: '#/components/schemas/Perfil'
      example:
        id: 4f1c2a9e-8b7d-4c3a-9e2f-1a2b3c4d5e6f
        nome: João Silva
        email: joao.silva@ufms.br
        perfis: [participante]
    UsuarioRegistrado:
      type: object
      required: [id, nome, email, desativado]
      properties:
        id:
          type: string
          description: Identificador do usuário.
        nome:
          type: string
          description: Nome; vazio se não informado.
        email:
          type: string
          description: E-mail; vazio se não informado.
        desativado:
          type: boolean
          description: Se o acesso ao FACOFFEE está desativado.
      example:
        id: 4f1c2a9e-8b7d-4c3a-9e2f-1a2b3c4d5e6f
        nome: João Silva
        email: joao.silva@ufms.br
        desativado: false
