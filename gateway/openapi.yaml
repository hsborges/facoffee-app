openapi: 3.1.0
info:
  title: FACOFFEE API
  version: 0.1.0
  description: |
    API do FACOFFEE.

    Todas as rotas exigem autenticação. Para testar aqui, clique em **Authorize** e entre com
    usuário e senha (`login`) ou informe um access token (`bearer`). Usuário com acesso
    desativado recebe 403 em todas as rotas.
servers:
  - url: /
security:
  - login: [openid]
  - bearer: []
tags:
  - name: usuario
    description: Usuários
  - name: participacao
    description: Participação
  - name: financeiro
    description: Financeiro
paths:
  /api/usuario:
    get:
      tags: [usuario]
      operationId: listarUsuarios
      summary: Listar usuários
      description: |
        Usuários que já acessaram o FACOFFEE, em ordem de nome, indicando quem está com o acesso
        desativado. Só o gestor lista os usuários.
      responses:
        '200':
          description: Usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioRegistrado'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/usuario/eu:
    get:
      tags: [usuario]
      operationId: obterUsuarioLogado
      summary: Usuário logado
      description: Dados e perfis de acesso do usuário autenticado.
      responses:
        '200':
          description: Usuário logado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/usuario/{id}/desativar:
    post:
      tags: [usuario]
      operationId: desativarAcesso
      summary: Desativar acesso
      description: |
        Desativa o acesso de um usuário ao FACOFFEE. O gestor desativa o acesso de qualquer
        pessoa; os demais, só o próprio. Desativar um acesso já desativado não tem efeito.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do usuário.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Acesso desativado.
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          description: Sem permissão para desativar o acesso de outra pessoa, ou acesso desativado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                semPermissao:
                  value:
                    error: sem-permissao
                acessoDesativado:
                  value:
                    error: acesso-desativado
        '404':
          description: Identificador inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: not-found
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/usuario/{id}/reativar:
    post:
      tags: [usuario]
      operationId: reativarAcesso
      summary: Reativar acesso
      description: |
        Reativa o acesso de um usuário ao FACOFFEE. Só o gestor reativa. Reativar não devolve a
        participação: para voltar a participar, a pessoa pede a entrada de novo. Reativar um
        acesso ativo não tem efeito.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do usuário.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Acesso reativado.
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '404':
          description: Identificador inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: not-found
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/participacao/entrar:
    post:
      tags: [participacao]
      operationId: pedirEntrada
      summary: Pedir entrada e escolher tipo de cota
      description: |
        O usuário logado passa a participar da divisão dos custos da copa com o tipo de cota
        escolhido. Quem já saiu retorna pedindo a entrada de novo, com qualquer tipo de cota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoDeCota]
              properties:
                tipoDeCota:
                  $ref: '#/components/schemas/TipoDeCota'
      responses:
        '204':
          description: Entrada feita.
        '400':
          description: Tipo de cota ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: tipo-de-cota-invalido
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '409':
          description: O usuário já está participando.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: ja-participando
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/participacao/trocar-tipo-de-cota:
    post:
      tags: [participacao]
      operationId: trocarTipoDeCota
      summary: Trocar tipo de cota
      description: |
        Troca o tipo de cota do usuário logado. A troca só vale a partir do mês seguinte (horário
        de Campo Grande): a cota do mês atual não muda. Uma nova troca no mesmo mês substitui a
        anterior, e pedir o tipo de cota atual cancela a troca.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoDeCota]
              properties:
                tipoDeCota:
                  $ref: '#/components/schemas/TipoDeCota'
      responses:
        '204':
          description: Troca registrada.
        '400':
          description: Tipo de cota ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: tipo-de-cota-invalido
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '409':
          $ref: '#/components/responses/NaoParticipando'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/participacao/sair:
    post:
      tags: [participacao]
      operationId: pedirSaida
      summary: Pedir saída
      description: |
        O usuário logado deixa de participar da divisão dos custos da copa. Para voltar, pede a
        entrada de novo.
      responses:
        '204':
          description: Saída feita.
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '409':
          $ref: '#/components/responses/NaoParticipando'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/participacao/definir-valor-da-cota:
    post:
      tags: [participacao]
      operationId: definirValorDaCota
      summary: Definir valor da cota
      description: |
        Define o valor mensal de um tipo de cota para um ano, o atual ou um seguinte. Só o gestor
        define, uma vez por tipo de cota e ano: o valor não muda durante o ano.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoDeCota, ano, valorEmCentavos]
              properties:
                tipoDeCota:
                  $ref: '#/components/schemas/TipoDeCota'
                ano:
                  type: integer
                  description: Ano em que o valor vale.
                  example: 2027
                valorEmCentavos:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Valor mensal em centavos de real.
                  example: 2500
      responses:
        '204':
          description: Valor definido.
        '400':
          description: Pedido inválido, ou ano que já passou.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                pedidoInvalido:
                  value:
                    error: pedido-invalido
                anoPassado:
                  value:
                    error: ano-passado
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '409':
          description: O valor desse tipo de cota já foi definido para o ano.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: valor-ja-definido
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/guardar-comprovante:
    post:
      tags: [financeiro]
      operationId: guardarComprovante
      summary: Guardar comprovante
      description: |
        Guarda o comprovante de um pagamento por PIX de um participante. Só o gestor guarda, já
        que só ele recebe pagamentos. Devolve o identificador do comprovante, usado ao receber o
        pagamento.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo, participanteId]
              properties:
                arquivo:
                  $ref: '#/components/schemas/ArquivoEnviado'
                participanteId:
                  type: string
                  format: uuid
                  description: Participante que fez o pagamento; só ele e o gestor veem o comprovante.
      responses:
        '201':
          $ref: '#/components/responses/ArquivoGuardado'
        '400':
          $ref: '#/components/responses/ArquivoRecusado'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '413':
          $ref: '#/components/responses/ArquivoGrandeDemais'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/guardar-nota:
    post:
      tags: [financeiro]
      operationId: guardarNota
      summary: Guardar nota
      description: |
        Guarda a nota fiscal ou o recibo de um gasto. Qualquer participante guarda. Devolve o
        identificador da nota, usado ao registrar o gasto.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  $ref: '#/components/schemas/ArquivoEnviado'
      responses:
        '201':
          $ref: '#/components/responses/ArquivoGuardado'
        '400':
          $ref: '#/components/responses/ArquivoRecusado'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '413':
          $ref: '#/components/responses/ArquivoGrandeDemais'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/receber-pagamento:
    post:
      tags: [financeiro]
      operationId: receberPagamento
      summary: Receber pagamento
      description: |
        Registra o dinheiro que o gestor recebeu de um participante, por PIX ou em mãos. Só o
        gestor recebe pagamentos. O pagamento por PIX exige o comprovante, guardado antes em
        `guardar-comprovante` para o mesmo participante; cada comprovante vale para um pagamento
        só. Todo pagamento entra na caixinha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participanteId, valorEmCentavos, forma]
              properties:
                participanteId:
                  type: string
                  format: uuid
                  description: Participante que pagou.
                valorEmCentavos:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Valor recebido em centavos de real.
                  example: 3000
                forma:
                  type: string
                  enum: [pix, dinheiro]
                  description: Forma do pagamento; `dinheiro` é o pagamento em mãos.
                comprovanteId:
                  type: [string, 'null']
                  format: uuid
                  description: Comprovante do PIX; obrigatório no PIX, ausente ou nulo no dinheiro.
      responses:
        '201':
          description: Pagamento recebido.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Identificador do pagamento.
        '400':
          description: |
            Pedido inválido ou acima de 4 KB, pagamento por PIX sem comprovante ou pagamento em
            dinheiro com comprovante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                pedidoInvalido:
                  value:
                    error: pedido-invalido
                pixSemComprovante:
                  value:
                    error: pix-sem-comprovante
                comprovanteSoNoPix:
                  value:
                    error: comprovante-so-no-pix
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '404':
          description: Comprovante não guardado para esse participante, ou participante desconhecido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                comprovanteNaoEncontrado:
                  value:
                    error: comprovante-nao-encontrado
                participanteNaoEncontrado:
                  value:
                    error: participante-nao-encontrado
        '409':
          description: O comprovante já foi usado em outro pagamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: comprovante-ja-usado
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/participante:
    get:
      tags: [financeiro]
      operationId: listarCreditoEPendentes
      summary: Crédito e pendentes
      description: |
        Crédito e pendência de cada participante, inclusive de quem saiu. Só o gestor lista os
        participantes; cada um vê a própria situação em `participante/eu`.
      responses:
        '200':
          description: Situação de cada participante.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditoEPendente'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/participante/eu:
    get:
      tags: [financeiro]
      operationId: obterCreditoEPendente
      summary: Meu crédito ou pendência
      description: Crédito e pendência do usuário logado.
      responses:
        '200':
          description: Situação do usuário logado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditoEPendente'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '404':
          description: O usuário nunca participou.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: participante-nao-encontrado
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/comprovante/{id}:
    get:
      tags: [financeiro]
      operationId: baixarComprovante
      summary: Baixar comprovante
      description: |
        O arquivo do comprovante. Só o participante que fez o pagamento e o gestor veem o
        comprovante; para os demais, ele não existe (404).
      parameters:
        - $ref: '#/components/parameters/IdDoArquivo'
      responses:
        '200':
          $ref: '#/components/responses/Arquivo'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '404':
          $ref: '#/components/responses/ArquivoNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/nota/{id}:
    get:
      tags: [financeiro]
      operationId: baixarNota
      summary: Baixar nota
      description: O arquivo da nota de um gasto. Qualquer participante vê as notas.
      parameters:
        - $ref: '#/components/parameters/IdDoArquivo'
      responses:
        '200':
          $ref: '#/components/responses/Arquivo'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '404':
          $ref: '#/components/responses/ArquivoNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
components:
  securitySchemes:
    login:
      type: oauth2
      description: Entrar com usuário e senha.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/realms/facoffee/protocol/openid-connect/auth
          tokenUrl: http://localhost:8080/realms/facoffee/protocol/openid-connect/token
          scopes:
            openid: Identificação do usuário
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtido ao entrar no FACOFFEE.
  parameters:
    IdDoArquivo:
      name: id
      in: path
      required: true
      description: Identificador do arquivo.
      schema:
        type: string
        format: uuid
  responses:
    NaoAutorizado:
      description: Token ausente, inválido ou expirado.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: unauthorized
    AcessoDesativado:
      description: O acesso do usuário ao FACOFFEE foi desativado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: acesso-desativado
    SomenteGestor:
      description: Só o gestor pode fazer isso, ou acesso desativado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            semPermissao:
              value:
                error: sem-permissao
            acessoDesativado:
              value:
                error: acesso-desativado
    NaoParticipando:
      description: O usuário não está participando.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: nao-participando
    ErroInterno:
      description: Erro interno.
    ArquivoGuardado:
      description: Arquivo guardado.
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id:
                type: string
                format: uuid
                description: Identificador do arquivo.
    ArquivoRecusado:
      description: Pedido sem arquivo ou com campos inválidos, arquivo vazio ou de tipo não aceito.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            pedidoInvalido:
              value:
                error: pedido-invalido
            arquivoVazio:
              value:
                error: arquivo-vazio
            tipoNaoAceito:
              value:
                error: tipo-nao-aceito
    ArquivoGrandeDemais:
      description: Arquivo com mais de 5 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: arquivo-grande-demais
    Arquivo:
      description: O arquivo, com o tipo reconhecido no envio.
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
    ArquivoNaoEncontrado:
      description: Arquivo inexistente ou que o usuário não pode ver.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: not-found
  schemas:
    ArquivoEnviado:
      type: string
      format: binary
      description: |
        PDF, JPEG ou PNG, com até 5 MB. O tipo é reconhecido pelo conteúdo, não pela extensão.
    Erro:
      type: object
      required: [error]
      properties:
        error:
          type: string
    TipoDeCota:
      type: string
      enum: [so-cafe, completa]
      description: |
        Tipo de cota: `so-cafe` dá direito ao café; `completa`, ao café, às bolachas, aos chás e
        aos demais itens da copa.
    CreditoEPendente:
      type: object
      required: [id, ativo, creditoEmCentavos, pendenteEmCentavos]
      description: |
        Pagamentos recebidos menos o que é devido. O que foi pago a mais é crédito, abatido
        automaticamente das próximas cotas; o que falta é pendência, sem multa nem juros. Crédito
        e pendência continuam valendo depois da saída e no retorno. No máximo um dos dois valores
        é diferente de zero.
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do participante.
        ativo:
          type: boolean
          description: Se está participando agora.
        creditoEmCentavos:
          type: integer
          minimum: 0
          description: Crédito em centavos de real.
        pendenteEmCentavos:
          type: integer
          minimum: 0
          description: Valor pendente em centavos de real.
      example:
        id: 4f1c2a9e-8b7d-4c3a-9e2f-1a2b3c4d5e6f
        ativo: true
        creditoEmCentavos: 6000
        pendenteEmCentavos: 0
    Perfil:
      type: string
      enum: [gestor, participante]
      description: Perfil de acesso ao FACOFFEE.
    Usuario:
      type: object
      required: [id, nome, email, perfis]
      properties:
        id:
          type: string
          description: Identificador do usuário.
        nome:
          type: string
          description: Nome; vazio se não informado.
        email:
          type: string
          description: E-mail; vazio se não informado.
        perfis:
          type: array
          items:
            $ref: '#/components/schemas/Perfil'
      example:
        id: 4f1c2a9e-8b7d-4c3a-9e2f-1a2b3c4d5e6f
        nome: João Silva
        email: joao.silva@ufms.br
        perfis: [participante]
    UsuarioRegistrado:
      type: object
      required: [id, nome, email, desativado]
      properties:
        id:
          type: string
          description: Identificador do usuário.
        nome:
          type: string
          description: Nome; vazio se não informado.
        email:
          type: string
          description: E-mail; vazio se não informado.
        desativado:
          type: boolean
          description: Se o acesso ao FACOFFEE está desativado.
      example:
        id: 4f1c2a9e-8b7d-4c3a-9e2f-1a2b3c4d5e6f
        nome: João Silva
        email: joao.silva@ufms.br
        desativado: false
