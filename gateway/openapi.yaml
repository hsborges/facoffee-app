openapi: 3.1.0
info:
  title: FACOFFEE API
  version: 0.1.0
  description: |
    API do FACOFFEE.

    Todas as rotas exigem autenticação. Para testar aqui, clique em **Authorize** e entre com
    usuário e senha (`login`) ou informe um access token (`bearer`). Usuário com acesso
    desativado recebe 403 em todas as rotas.
servers:
  - url: /
security:
  - login: [openid]
  - bearer: []
tags:
  - name: usuario
    description: Usuários
  - name: participacao
    description: Participação
  - name: financeiro
    description: Financeiro
paths:
  /api/usuario:
    get:
      tags: [usuario]
      operationId: listarUsuarios
      summary: Listar usuários
      description: |
        Usuários que já acessaram o FACOFFEE, em ordem de nome, indicando quem está com o acesso
        desativado. Só o gestor lista os usuários.
      responses:
        '200':
          description: Usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioRegistrado'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/usuario/eu:
    get:
      tags: [usuario]
      operationId: obterUsuarioLogado
      summary: Usuário logado
      description: Dados e perfis de acesso do usuário autenticado.
      responses:
        '200':
          description: Usuário logado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/usuario/{id}/desativar:
    post:
      tags: [usuario]
      operationId: desativarAcesso
      summary: Desativar acesso
      description: |
        Desativa o acesso de um usuário ao FACOFFEE. O gestor desativa o acesso de qualquer
        pessoa; os demais, só o próprio. Desativar um acesso já desativado não tem efeito.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do usuário.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Acesso desativado.
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          description: Sem permissão para desativar o acesso de outra pessoa, ou acesso desativado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                semPermissao:
                  value:
                    error: sem-permissao
                acessoDesativado:
                  value:
                    error: acesso-desativado
        '404':
          description: Identificador inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: not-found
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/usuario/{id}/reativar:
    post:
      tags: [usuario]
      operationId: reativarAcesso
      summary: Reativar acesso
      description: |
        Reativa o acesso de um usuário ao FACOFFEE. Só o gestor reativa. Reativar não devolve a
        participação: para voltar a participar, a pessoa pede a entrada de novo. Reativar um
        acesso ativo não tem efeito.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do usuário.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Acesso reativado.
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '404':
          description: Identificador inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: not-found
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/participacao/entrar:
    post:
      tags: [participacao]
      operationId: pedirEntrada
      summary: Pedir entrada e escolher tipo de cota
      description: |
        O usuário logado passa a participar da divisão dos custos da copa com o tipo de cota
        escolhido. Quem já saiu retorna pedindo a entrada de novo, com qualquer tipo de cota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoDeCota]
              properties:
                tipoDeCota:
                  $ref: '#/components/schemas/TipoDeCota'
      responses:
        '204':
          description: Entrada feita.
        '400':
          description: Tipo de cota ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: tipo-de-cota-invalido
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '409':
          description: O usuário já está participando.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: ja-participando
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/participacao/trocar-tipo-de-cota:
    post:
      tags: [participacao]
      operationId: trocarTipoDeCota
      summary: Trocar tipo de cota
      description: |
        Troca o tipo de cota do usuário logado. A troca só vale a partir do mês seguinte (horário
        de Campo Grande): a cota do mês atual não muda. Uma nova troca no mesmo mês substitui a
        anterior, e pedir o tipo de cota atual cancela a troca.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoDeCota]
              properties:
                tipoDeCota:
                  $ref: '#/components/schemas/TipoDeCota'
      responses:
        '204':
          description: Troca registrada.
        '400':
          description: Tipo de cota ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: tipo-de-cota-invalido
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '409':
          $ref: '#/components/responses/NaoParticipando'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/participacao/sair:
    post:
      tags: [participacao]
      operationId: pedirSaida
      summary: Pedir saída
      description: |
        O usuário logado deixa de participar da divisão dos custos da copa. Para voltar, pede a
        entrada de novo.
      responses:
        '204':
          description: Saída feita.
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '409':
          $ref: '#/components/responses/NaoParticipando'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/participacao/participante/eu:
    get:
      tags: [participacao]
      operationId: obterParticipacao
      summary: Minha participação
      description: |
        Se o usuário logado está participando, o tipo de cota que vale no mês atual (horário de
        Campo Grande) e, enquanto participa, a troca de tipo de cota que ainda espera o mês
        seguinte, se houver.
      responses:
        '200':
          description: Participação do usuário logado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participacao'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '404':
          description: O usuário nunca participou.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: participante-nao-encontrado
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/participacao/tipo-de-cota:
    get:
      tags: [participacao]
      operationId: listarValoresDaCota
      summary: Valores da cota
      description: |
        O valor mensal de cada tipo de cota no ano atual (horário de Campo Grande), ou no ano
        pedido. Qualquer usuário logado consulta; mostra só os valores, sem a situação de ninguém.
        Um tipo de cota sem valor definido para o ano não aparece.
      parameters:
        - name: ano
          in: query
          required: false
          description: Ano dos valores; sem ele, o ano atual.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          example: 2027
      responses:
        '200':
          description: Valor de cada tipo de cota no ano.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [tipoDeCota, ano, valorEmCentavos]
                  properties:
                    tipoDeCota:
                      $ref: '#/components/schemas/TipoDeCota'
                    ano:
                      type: integer
                      description: Ano em que o valor vale.
                    valorEmCentavos:
                      type: integer
                      minimum: 1
                      description: Valor mensal em centavos de real.
              example:
                - tipoDeCota: so-cafe
                  ano: 2027
                  valorEmCentavos: 2500
                - tipoDeCota: completa
                  ano: 2027
                  valorEmCentavos: 3500
        '400':
          description: Ano inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: pedido-invalido
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/participacao/definir-valor-da-cota:
    post:
      tags: [participacao]
      operationId: definirValorDaCota
      summary: Definir valor da cota
      description: |
        Define o valor mensal de um tipo de cota para um ano, o atual ou um seguinte. Só o gestor
        define, uma vez por tipo de cota e ano: o valor não muda durante o ano.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoDeCota, ano, valorEmCentavos]
              properties:
                tipoDeCota:
                  $ref: '#/components/schemas/TipoDeCota'
                ano:
                  type: integer
                  description: Ano em que o valor vale.
                  example: 2027
                valorEmCentavos:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Valor mensal em centavos de real.
                  example: 2500
      responses:
        '204':
          description: Valor definido.
        '400':
          description: Pedido inválido, ou ano que já passou.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                pedidoInvalido:
                  value:
                    error: pedido-invalido
                anoPassado:
                  value:
                    error: ano-passado
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '409':
          description: O valor desse tipo de cota já foi definido para o ano.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: valor-ja-definido
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/guardar-comprovante:
    post:
      tags: [financeiro]
      operationId: guardarComprovante
      summary: Guardar comprovante
      description: |
        Guarda o comprovante de um pagamento por PIX de um participante. O gestor guarda para
        qualquer participante, ao receber o pagamento; o participante guarda só para si mesmo, para
        enviá-lo ao gestor. Devolve o identificador do comprovante, usado ao receber o pagamento ou
        ao enviar o comprovante.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo, participanteId]
              properties:
                arquivo:
                  $ref: '#/components/schemas/ArquivoEnviado'
                participanteId:
                  type: string
                  format: uuid
                  description: |
                    Participante cujas cotas o pagamento quita, mesmo que outra pessoa tenha feito o
                    PIX; só ele e o gestor veem o comprovante.
      responses:
        '201':
          $ref: '#/components/responses/ArquivoGuardado'
        '400':
          $ref: '#/components/responses/ArquivoRecusado'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          description: |
            Quem não é gestor guardando comprovante de outro participante, ou acesso desativado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                semPermissao:
                  value:
                    error: sem-permissao
                acessoDesativado:
                  value:
                    error: acesso-desativado
        '413':
          $ref: '#/components/responses/ArquivoGrandeDemais'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/guardar-nota:
    post:
      tags: [financeiro]
      operationId: guardarNota
      summary: Guardar nota
      description: |
        Guarda a nota fiscal ou o recibo de um gasto. Qualquer participante guarda. Devolve o
        identificador da nota, usado por quem a guardou ao registrar o gasto.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  $ref: '#/components/schemas/ArquivoEnviado'
      responses:
        '201':
          $ref: '#/components/responses/ArquivoGuardado'
        '400':
          $ref: '#/components/responses/ArquivoRecusado'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '413':
          $ref: '#/components/responses/ArquivoGrandeDemais'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/receber-pagamento:
    post:
      tags: [financeiro]
      operationId: receberPagamento
      summary: Receber pagamento
      description: |
        Registra o dinheiro que o gestor recebeu de um participante, por PIX ou em mãos. Só o
        gestor recebe pagamentos. Quando alguém paga por outro, o pagamento é registrado para o
        participante cujas cotas ele quita; para várias pessoas, registra-se um pagamento para cada
        uma. O pagamento por PIX exige o comprovante, guardado antes em
        `guardar-comprovante` para o mesmo participante; cada comprovante vale para um pagamento
        só. Todo pagamento entra na caixinha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participanteId, valorEmCentavos, forma]
              properties:
                participanteId:
                  type: string
                  format: uuid
                  description: |
                    Participante cujas cotas o pagamento quita, mesmo que outra pessoa tenha
                    entregado o dinheiro.
                valorEmCentavos:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Valor recebido em centavos de real.
                  example: 3000
                forma:
                  type: string
                  enum: [pix, dinheiro]
                  description: Forma do pagamento; `dinheiro` é o pagamento em mãos.
                comprovanteId:
                  type: [string, 'null']
                  format: uuid
                  description: Comprovante do PIX; obrigatório no PIX, ausente ou nulo no dinheiro.
      responses:
        '201':
          description: Pagamento recebido.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Identificador do pagamento.
        '400':
          description: |
            Pedido inválido ou acima de 4 KB, pagamento por PIX sem comprovante ou pagamento em
            dinheiro com comprovante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                pedidoInvalido:
                  value:
                    error: pedido-invalido
                pixSemComprovante:
                  value:
                    error: pix-sem-comprovante
                comprovanteSoNoPix:
                  value:
                    error: comprovante-so-no-pix
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '404':
          description: Comprovante não guardado para esse participante, ou participante desconhecido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                comprovanteNaoEncontrado:
                  value:
                    error: comprovante-nao-encontrado
                participanteNaoEncontrado:
                  value:
                    error: participante-nao-encontrado
        '409':
          description: O comprovante já foi usado em outro pagamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: comprovante-ja-usado
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/enviar-comprovante:
    post:
      tags: [financeiro]
      operationId: enviarComprovante
      summary: Enviar comprovante
      description: |
        O usuário logado envia ao gestor o comprovante do PIX que fez, com o valor pago. O
        comprovante fica a confirmar e não conta como pagamento até o gestor confirmar; até lá, não
        muda o crédito, a pendência nem o saldo da caixinha. O arquivo é guardado antes em
        `guardar-comprovante`, para o próprio usuário logado; cada arquivo é enviado uma vez só.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeComprovante'
      responses:
        '201':
          description: Comprovante enviado, a confirmar.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Identificador do comprovante enviado.
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '404':
          description: Arquivo não guardado para o usuário logado, ou ele nunca participou.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                comprovanteNaoEncontrado:
                  value:
                    error: comprovante-nao-encontrado
                participanteNaoEncontrado:
                  value:
                    error: participante-nao-encontrado
        '409':
          description: O arquivo já foi enviado em outro comprovante ou usado em outro pagamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: comprovante-ja-usado
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/comprovante-enviado:
    get:
      tags: [financeiro]
      operationId: listarComprovantesAConfirmar
      summary: Comprovantes a confirmar
      description: |
        Os comprovantes enviados pelos participantes que ainda estão a confirmar, do mais antigo ao
        mais recente. Só o gestor lista.
      responses:
        '200':
          description: Comprovantes a confirmar.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComprovanteEnviado'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/comprovante-enviado/eu:
    get:
      tags: [financeiro]
      operationId: listarMeusComprovantes
      summary: Meus comprovantes enviados
      description: |
        Os comprovantes que o usuário logado enviou, do mais recente ao mais antigo, com a
        situação de cada um: a confirmar, confirmado (com o valor confirmado) ou recusado (com o
        motivo). O envio cancelado não aparece.
      responses:
        '200':
          description: Comprovantes enviados pelo usuário logado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComprovanteEnviado'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/comprovante-enviado/{id}/editar:
    post:
      tags: [financeiro]
      operationId: editarComprovante
      summary: Editar comprovante
      description: |
        O usuário logado troca o valor pago e o arquivo de um comprovante que enviou, enquanto
        está a confirmar. O arquivo pode ser o mesmo ou outro, guardado antes em
        `guardar-comprovante` para o próprio usuário logado.
      parameters:
        - $ref: '#/components/parameters/IdDoComprovanteEnviado'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeComprovante'
      responses:
        '204':
          description: Comprovante editado.
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '404':
          description: |
            Comprovante que não existe ou não é do usuário logado, ou arquivo não guardado para ele.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                comprovanteEnviadoNaoEncontrado:
                  value:
                    error: comprovante-enviado-nao-encontrado
                comprovanteNaoEncontrado:
                  value:
                    error: comprovante-nao-encontrado
        '409':
          description: |
            O comprovante já foi confirmado ou recusado, ou o arquivo já foi enviado em outro
            comprovante ou usado em outro pagamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                comprovanteJaAnalisado:
                  value:
                    error: comprovante-ja-analisado
                comprovanteJaUsado:
                  value:
                    error: comprovante-ja-usado
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/comprovante-enviado/{id}/cancelar:
    post:
      tags: [financeiro]
      operationId: cancelarComprovante
      summary: Cancelar comprovante
      description: |
        O usuário logado cancela o envio de um comprovante, enquanto está a confirmar. O
        comprovante cancelado não conta como pagamento e deixa de aparecer.
      parameters:
        - $ref: '#/components/parameters/IdDoComprovanteEnviado'
      responses:
        '204':
          description: Envio cancelado.
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '404':
          $ref: '#/components/responses/ComprovanteEnviadoNaoEncontrado'
        '409':
          $ref: '#/components/responses/ComprovanteJaAnalisado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/comprovante-enviado/{id}/confirmar:
    post:
      tags: [financeiro]
      operationId: confirmarComprovante
      summary: Confirmar comprovante
      description: |
        O gestor confere o comprovante e recebe o pagamento por PIX, com o valor confirmado, que
        pode corrigir o valor informado pelo participante. Vale o valor confirmado: o pagamento
        quita as cotas do participante e entra na caixinha, como o pagamento recebido em
        `receber-pagamento`. Cada comprovante é confirmado ou recusado uma vez só. Só o gestor
        confirma. O pedido informa o arquivo que o gestor conferiu; se o participante trocou o
        arquivo depois disso, a confirmação é recusada.
      parameters:
        - $ref: '#/components/parameters/IdDoComprovanteEnviado'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valorEmCentavos, comprovanteId]
              properties:
                valorEmCentavos:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Valor confirmado em centavos de real.
                  example: 3000
                comprovanteId:
                  type: string
                  format: uuid
                  description: Arquivo do comprovante que o gestor conferiu.
      responses:
        '201':
          description: Comprovante confirmado e pagamento recebido.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Identificador do pagamento.
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '404':
          $ref: '#/components/responses/ComprovanteEnviadoNaoEncontrado'
        '409':
          description: |
            O comprovante já foi confirmado ou recusado, o participante trocou o arquivo depois
            que o gestor o conferiu, ou o arquivo já foi usado em outro pagamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                comprovanteJaAnalisado:
                  value:
                    error: comprovante-ja-analisado
                comprovanteAlterado:
                  value:
                    error: comprovante-alterado
                comprovanteJaUsado:
                  value:
                    error: comprovante-ja-usado
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/comprovante-enviado/{id}/recusar:
    post:
      tags: [financeiro]
      operationId: recusarComprovante
      summary: Recusar comprovante
      description: |
        O gestor recusa o comprovante, informando o motivo, que o participante vê. O comprovante
        recusado não conta como pagamento. Cada comprovante é confirmado ou recusado uma vez só.
        Só o gestor recusa.
      parameters:
        - $ref: '#/components/parameters/IdDoComprovanteEnviado'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Por que o comprovante foi recusado; não pode ficar em branco.
                  example: O valor não bate com o PIX.
      responses:
        '204':
          description: Comprovante recusado.
        '400':
          description: Pedido inválido ou acima de 4 KB, ou motivo em branco.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                pedidoInvalido:
                  value:
                    error: pedido-invalido
                recusaSemMotivo:
                  value:
                    error: recusa-sem-motivo
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '404':
          $ref: '#/components/responses/ComprovanteEnviadoNaoEncontrado'
        '409':
          $ref: '#/components/responses/ComprovanteJaAnalisado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/registrar-gasto:
    post:
      tags: [financeiro]
      operationId: registrarGasto
      summary: Registrar gasto
      description: |
        Registra uma compra, um conserto, uma manutenção ou uma reposição que a pessoa logada
        pagou, com dinheiro da caixinha ou do próprio bolso. Qualquer participante registra gastos.
        Basta o tipo, o valor total e a nota, guardada antes em `guardar-nota` pela própria pessoa
        logada; cada nota vale para um gasto só. O gasto pago do próprio bolso só sai da caixinha no
        reembolso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valorEmCentavos, origem, tipo, notaId]
              properties:
                valorEmCentavos:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Valor total do gasto em centavos de real.
                  example: 4590
                origem:
                  type: string
                  enum: [caixinha, proprio-bolso]
                  description: De onde saiu o dinheiro.
                tipo:
                  $ref: '#/components/schemas/TipoDeGasto'
                notaId:
                  type: string
                  format: uuid
                  description: Nota do gasto.
      responses:
        '201':
          description: Gasto registrado.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Identificador do gasto.
        '400':
          description: Pedido inválido ou acima de 4 KB; um gasto sem tipo é inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: pedido-invalido
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          description: Nota não guardada pela pessoa logada, ou ela não é um participante conhecido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                notaNaoEncontrada:
                  value:
                    error: nota-nao-encontrada
                participanteNaoEncontrado:
                  value:
                    error: participante-nao-encontrado
        '409':
          description: A nota já foi usada em outro gasto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: nota-ja-usada
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/gasto/{id}/reembolsar:
    post:
      tags: [financeiro]
      operationId: reembolsarGasto
      summary: Reembolsar
      description: |
        Devolve o valor total de um gasto pago do próprio bolso a quem o registrou. Só o gestor
        reembolsa, e cada gasto é reembolsado uma vez só. O dinheiro desse gasto sai da caixinha
        no reembolso.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do gasto.
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Reembolso feito.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Identificador do reembolso.
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '404':
          description: Gasto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: gasto-nao-encontrado
        '409':
          description: O gasto já foi reembolsado, ou foi pago pela caixinha e não tem reembolso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                gastoJaReembolsado:
                  value:
                    error: gasto-ja-reembolsado
                gastoPagoPelaCaixinha:
                  value:
                    error: gasto-pago-pela-caixinha
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/solicitar-complemento:
    post:
      tags: [financeiro]
      operationId: solicitarComplemento
      summary: Solicitar complemento
      description: |
        Pede um valor extra aos participantes quando o saldo da caixinha não cobre os gastos. Só o
        gestor solicita complementos. O valor é dividido em partes iguais entre todos os
        participantes ativos no momento, inclusive os pendentes e sem considerar o tipo de cota;
        os centavos que não dividem vão um para cada participante, e a soma das partes é sempre o
        valor total. Quem entra depois não deve parte; quem sai depois continua devendo. A parte
        é abatida automaticamente do crédito do participante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valorEmCentavos]
              properties:
                valorEmCentavos:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Valor total do complemento em centavos de real.
                  example: 1001
      responses:
        '201':
          description: Complemento solicitado.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Identificador do complemento.
        '400':
          description: Pedido inválido ou acima de 4 KB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: pedido-invalido
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '409':
          description: |
            Não há participante ativo, ou o valor é menor que o número de participantes ativos e
            alguma parte ficaria sem nenhum centavo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                semParticipantesAtivos:
                  value:
                    error: sem-participantes-ativos
                parteMenorQueUmCentavo:
                  value:
                    error: parte-menor-que-um-centavo
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/caixinha:
    get:
      tags: [financeiro]
      operationId: consultarCaixinha
      summary: Caixinha
      description: |
        Saldo da caixinha e gastos do ano anterior, no total e por tipo de gasto. Qualquer
        participante consulta; mostra só os totais, sem a situação de ninguém.
      responses:
        '200':
          description: Saldo e gastos do ano anterior.
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    saldoEmCentavos,
                    gastosDoAnoAnteriorEmCentavos,
                    gastosDoAnoAnteriorPorTipoEmCentavos,
                  ]
                properties:
                  saldoEmCentavos:
                    type: integer
                    description: |
                      Pagamentos recebidos menos gastos pagos pela caixinha e reembolsos, em
                      centavos de real. Um gasto pago do próprio bolso só sai da caixinha no
                      reembolso. Fica negativo quando os gastos passam do que entrou.
                  gastosDoAnoAnteriorEmCentavos:
                    type: integer
                    minimum: 0
                    description: |
                      Soma dos gastos feitos no ano anterior, pagos pela caixinha ou do próprio
                      bolso, em centavos de real; o ano vira à meia-noite de Campo Grande (MS). É
                      a base para o valor da cota.
                  gastosDoAnoAnteriorPorTipoEmCentavos:
                    $ref: '#/components/schemas/PorTipoDeGasto'
                    description: Os mesmos gastos do ano anterior, por tipo de gasto, em centavos de real.
              example:
                saldoEmCentavos: 4500
                gastosDoAnoAnteriorEmCentavos: 384000
                gastosDoAnoAnteriorPorTipoEmCentavos:
                  cafe: 240000
                  outros-itens: 108000
                  conserto-e-manutencao: 30000
                  reposicao: 6000
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/caixinha/{mes}:
    get:
      tags: [financeiro]
      operationId: consultarCaixinhaDoMes
      summary: Caixinha do mês
      description: |
        O que entrou na caixinha no mês, o que saiu por tipo de gasto e quanto sobrou. Qualquer
        participante consulta; mostra só os totais, sem a situação de ninguém. O mês vira à
        meia-noite de Campo Grande (MS). Saldo no fim = saldo no início + recebido − gastos de todos
        os tipos; no mês atual, é o saldo da caixinha.
      parameters:
        - name: mes
          in: path
          required: true
          description: O mês, no formato `AAAA-MM`.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-10'
      responses:
        '200':
          description: Caixinha do mês.
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    mes,
                    saldoNoInicioEmCentavos,
                    recebidoEmCentavos,
                    gastosPorTipoEmCentavos,
                    saldoNoFimEmCentavos,
                  ]
                properties:
                  mes:
                    type: string
                    description: O mês, no formato `AAAA-MM`.
                  saldoNoInicioEmCentavos:
                    type: integer
                    description: Saldo da caixinha no início do mês, em centavos de real.
                  recebidoEmCentavos:
                    type: integer
                    minimum: 0
                    description: Pagamentos recebidos no mês, em centavos de real.
                  gastosPorTipoEmCentavos:
                    $ref: '#/components/schemas/PorTipoDeGasto'
                    description: |
                      O que saiu da caixinha no mês, por tipo de gasto, em centavos de real: os
                      gastos pagos pela caixinha e os reembolsos feitos no mês. Um gasto pago do
                      próprio bolso conta no mês do reembolso.
                  saldoNoFimEmCentavos:
                    type: integer
                    description: Saldo da caixinha no fim do mês, em centavos de real.
              example:
                mes: '2026-10'
                saldoNoInicioEmCentavos: 12000
                recebidoEmCentavos: 75000
                gastosPorTipoEmCentavos:
                  cafe: 42000
                  outros-itens: 18000
                  conserto-e-manutencao: 0
                  reposicao: 2500
                saldoNoFimEmCentavos: 24500
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '404':
          description: O mês não está no formato `AAAA-MM`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: not-found
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/gasto:
    get:
      tags: [financeiro]
      operationId: listarGastos
      summary: Gastos
      description: |
        Gastos registrados, do mais recente ao mais antigo, indicando os já reembolsados. Só o
        gestor lista os gastos.
      responses:
        '200':
          description: Gastos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gasto'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/participante:
    get:
      tags: [financeiro]
      operationId: listarCreditoEPendentes
      summary: Crédito e pendentes
      description: |
        Crédito e pendência de cada participante, inclusive de quem saiu. Só o gestor lista os
        participantes; cada um vê a própria situação em `participante/eu`.
      responses:
        '200':
          description: Situação de cada participante.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditoEPendente'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/SomenteGestor'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/participante/eu:
    get:
      tags: [financeiro]
      operationId: obterCreditoEPendente
      summary: Meu crédito ou pendência
      description: |
        Crédito e pendência do usuário logado, com as cotas e as partes de complementos que ele
        deve ou já deveu.
      responses:
        '200':
          description: Situação do usuário logado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinhaSituacao'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '404':
          description: O usuário nunca participou.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: participante-nao-encontrado
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/comprovante/{id}:
    get:
      tags: [financeiro]
      operationId: baixarComprovante
      summary: Baixar comprovante
      description: |
        O arquivo do comprovante. Só o participante cujas cotas o pagamento quita e o gestor veem o
        comprovante; para os demais, ele não existe (404).
      parameters:
        - $ref: '#/components/parameters/IdDoArquivo'
      responses:
        '200':
          $ref: '#/components/responses/Arquivo'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '404':
          $ref: '#/components/responses/ArquivoNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/financeiro/nota/{id}:
    get:
      tags: [financeiro]
      operationId: baixarNota
      summary: Baixar nota
      description: O arquivo da nota de um gasto. Qualquer participante vê as notas.
      parameters:
        - $ref: '#/components/parameters/IdDoArquivo'
      responses:
        '200':
          $ref: '#/components/responses/Arquivo'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/AcessoDesativado'
        '404':
          $ref: '#/components/responses/ArquivoNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
components:
  securitySchemes:
    login:
      type: oauth2
      description: Entrar com usuário e senha.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/realms/facoffee/protocol/openid-connect/auth
          tokenUrl: http://localhost:8080/realms/facoffee/protocol/openid-connect/token
          scopes:
            openid: Identificação do usuário
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtido ao entrar no FACOFFEE.
  parameters:
    IdDoComprovanteEnviado:
      name: id
      in: path
      required: true
      description: Identificador do comprovante enviado.
      schema:
        type: string
        format: uuid
    IdDoArquivo:
      name: id
      in: path
      required: true
      description: Identificador do arquivo.
      schema:
        type: string
        format: uuid
  responses:
    NaoAutorizado:
      description: Token ausente, inválido ou expirado.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: unauthorized
    AcessoDesativado:
      description: O acesso do usuário ao FACOFFEE foi desativado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: acesso-desativado
    SomenteGestor:
      description: Só o gestor pode fazer isso, ou acesso desativado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            semPermissao:
              value:
                error: sem-permissao
            acessoDesativado:
              value:
                error: acesso-desativado
    NaoParticipando:
      description: O usuário não está participando.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: nao-participando
    ErroInterno:
      description: Erro interno.
    PedidoInvalido:
      description: Pedido inválido ou acima de 4 KB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: pedido-invalido
    ComprovanteEnviadoNaoEncontrado:
      description: Comprovante enviado que não existe ou que o usuário não pode ver.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: comprovante-enviado-nao-encontrado
    ComprovanteJaAnalisado:
      description: O comprovante já foi confirmado ou recusado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: comprovante-ja-analisado
    ArquivoGuardado:
      description: Arquivo guardado.
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id:
                type: string
                format: uuid
                description: Identificador do arquivo.
    ArquivoRecusado:
      description: Pedido sem arquivo ou com campos inválidos, arquivo vazio ou de tipo não aceito.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            pedidoInvalido:
              value:
                error: pedido-invalido
            arquivoVazio:
              value:
                error: arquivo-vazio
            tipoNaoAceito:
              value:
                error: tipo-nao-aceito
    ArquivoGrandeDemais:
      description: Arquivo com mais de 5 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: arquivo-grande-demais
    Arquivo:
      description: O arquivo, com o tipo reconhecido no envio.
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
    ArquivoNaoEncontrado:
      description: Arquivo inexistente ou que o usuário não pode ver.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: not-found
  schemas:
    ArquivoEnviado:
      type: string
      format: binary
      description: |
        PDF, JPEG ou PNG, com até 5 MB. O tipo é reconhecido pelo conteúdo, não pela extensão.
    Erro:
      type: object
      required: [error]
      properties:
        error:
          type: string
    TipoDeCota:
      type: string
      enum: [so-cafe, completa]
      description: |
        Tipo de cota: `so-cafe` dá direito ao café; `completa`, ao café, às bolachas, aos chás e
        aos demais itens da copa.
    TipoDeGasto:
      type: string
      enum: [cafe, outros-itens, conserto-e-manutencao, reposicao]
      description: |
        Tipo de gasto: `cafe`; `outros-itens` da copa (açúcar, leite, bolachas, chás, filtros,
        copos); `conserto-e-manutencao` da máquina de café; `reposicao` de itens quebrados.
    PorTipoDeGasto:
      type: object
      required: [cafe, outros-itens, conserto-e-manutencao, reposicao]
      additionalProperties: false
      description: Um valor em centavos de real para cada tipo de gasto.
      properties:
        cafe:
          type: integer
          minimum: 0
        outros-itens:
          type: integer
          minimum: 0
        conserto-e-manutencao:
          type: integer
          minimum: 0
        reposicao:
          type: integer
          minimum: 0
    Gasto:
      type: object
      required: [id, participanteId, valorEmCentavos, origem, tipo, notaId, feitoEm, reembolsado]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do gasto.
        participanteId:
          type: string
          format: uuid
          description: Quem pagou e registrou o gasto.
        valorEmCentavos:
          type: integer
          minimum: 1
          description: Valor total do gasto em centavos de real.
        origem:
          type: string
          enum: [caixinha, proprio-bolso]
          description: De onde saiu o dinheiro.
        tipo:
          $ref: '#/components/schemas/TipoDeGasto'
        notaId:
          type: string
          format: uuid
          description: Nota do gasto, baixada em `/api/financeiro/nota/{id}`.
        feitoEm:
          type: string
          format: date-time
          description: Quando o gasto foi registrado.
        reembolsado:
          type: boolean
          description: Se o gasto pago do próprio bolso já foi reembolsado; sempre falso se pago pela caixinha.
      example:
        id: 3c2b1a09-8f7e-4d6c-9b5a-4e3d2c1b0a9f
        participanteId: 4f1c2a9e-8b7d-4c3a-9e2f-1a2b3c4d5e6f
        valorEmCentavos: 4590
        origem: proprio-bolso
        tipo: cafe
        notaId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        feitoEm: '2026-11-20T15:00:00.000Z'
        reembolsado: false
    PedidoDeComprovante:
      type: object
      required: [valorEmCentavos, comprovanteId]
      properties:
        valorEmCentavos:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Valor pago em centavos de real.
          example: 18000
        comprovanteId:
          type: string
          format: uuid
          description: Arquivo do comprovante, guardado em `guardar-comprovante` para o usuário logado.
    ComprovanteEnviado:
      type: object
      required: [id, participanteId, comprovanteId, valorEmCentavos, enviadoEm, situacao]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do comprovante enviado.
        participanteId:
          type: string
          format: uuid
          description: Quem enviou, cujas cotas o pagamento quita.
        comprovanteId:
          type: string
          format: uuid
          description: Arquivo do comprovante, baixado em `/api/financeiro/comprovante/{id}`.
        valorEmCentavos:
          type: integer
          minimum: 1
          description: Valor pago informado pelo participante, em centavos de real.
        enviadoEm:
          type: string
          format: date-time
          description: Quando o comprovante foi enviado.
        situacao:
          type: string
          enum: [a-confirmar, confirmado, recusado]
          description: |
            `a-confirmar` até o gestor analisar; `confirmado`, quando vale como pagamento;
            `recusado`, quando não vale.
        valorConfirmadoEmCentavos:
          type: integer
          minimum: 1
          description: Só no confirmado; o valor que vale como pagamento, em centavos de real.
        motivo:
          type: string
          description: Só no recusado; por que o gestor recusou.
      example:
        id: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a
        participanteId: 4f1c2a9e-8b7d-4c3a-9e2f-1a2b3c4d5e6f
        comprovanteId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        valorEmCentavos: 18000
        enviadoEm: '2026-11-03T13:00:00.000Z'
        situacao: confirmado
        valorConfirmadoEmCentavos: 15000
    CreditoEPendente:
      type: object
      required: [id, ativo, creditoEmCentavos, pendenteEmCentavos]
      description: |
        Pagamentos recebidos menos o que é devido. O que foi pago a mais é crédito, abatido
        automaticamente das próximas cotas; o que falta é pendência, sem multa nem juros. Crédito
        e pendência continuam valendo depois da saída e no retorno. No máximo um dos dois valores
        é diferente de zero.
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do participante.
        ativo:
          type: boolean
          description: Se está participando agora.
        creditoEmCentavos:
          type: integer
          minimum: 0
          description: Crédito em centavos de real.
        pendenteEmCentavos:
          type: integer
          minimum: 0
          description: Valor pendente em centavos de real.
      example:
        id: 4f1c2a9e-8b7d-4c3a-9e2f-1a2b3c4d5e6f
        ativo: true
        creditoEmCentavos: 6000
        pendenteEmCentavos: 0
    MinhaSituacao:
      allOf:
        - $ref: '#/components/schemas/CreditoEPendente'
        - type: object
          required: [cotas, complementos]
          properties:
            cotas:
              type: array
              description: Cotas devidas, da mais recente à mais antiga.
              items:
                type: object
                required: [mes, tipoDeCota, valorEmCentavos]
                properties:
                  mes:
                    type: string
                    pattern: '^\d{4}-\d{2}$'
                    description: Mês da cota (`AAAA-MM`).
                    example: '2026-11'
                  tipoDeCota:
                    $ref: '#/components/schemas/TipoDeCota'
                  valorEmCentavos:
                    type: integer
                    minimum: 1
                    description: Valor da cota em centavos de real; não muda depois de devida.
            complementos:
              type: array
              description: Partes de complementos devidas, da mais recente à mais antiga.
              items:
                type: object
                required: [id, solicitadoEm, parteEmCentavos]
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Identificador do complemento.
                  solicitadoEm:
                    type: string
                    format: date-time
                    description: Quando o gestor solicitou o complemento.
                  parteEmCentavos:
                    type: integer
                    minimum: 1
                    description: Parte do usuário logado, em centavos de real.
      example:
        id: 4f1c2a9e-8b7d-4c3a-9e2f-1a2b3c4d5e6f
        ativo: true
        creditoEmCentavos: 0
        pendenteEmCentavos: 3250
        cotas:
          - mes: '2026-11'
            tipoDeCota: completa
            valorEmCentavos: 3000
        complementos:
          - id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
            solicitadoEm: '2026-11-20T15:00:00.000Z'
            parteEmCentavos: 250
    Participacao:
      type: object
      required: [id, tipoDeCota, participando, troca]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do participante.
        tipoDeCota:
          $ref: '#/components/schemas/TipoDeCota'
        participando:
          type: boolean
          description: Se está participando agora; quem saiu volta pedindo a entrada.
        troca:
          description: Troca de tipo de cota que ainda não vale; nula se não houver.
          oneOf:
            - type: 'null'
            - type: object
              required: [tipoDeCota, aPartirDe]
              properties:
                tipoDeCota:
                  $ref: '#/components/schemas/TipoDeCota'
                aPartirDe:
                  type: string
                  pattern: '^\d{4}-\d{2}$'
                  description: Mês em que a troca passa a valer (`AAAA-MM`).
                  example: '2026-12'
      example:
        id: 4f1c2a9e-8b7d-4c3a-9e2f-1a2b3c4d5e6f
        tipoDeCota: so-cafe
        participando: true
        troca:
          tipoDeCota: completa
          aPartirDe: '2026-12'
    Perfil:
      type: string
      enum: [gestor, participante]
      description: Perfil de acesso ao FACOFFEE.
    Usuario:
      type: object
      required: [id, nome, email, perfis]
      properties:
        id:
          type: string
          description: Identificador do usuário.
        nome:
          type: string
          description: Nome; vazio se não informado.
        email:
          type: string
          description: E-mail; vazio se não informado.
        perfis:
          type: array
          items:
            $ref: '#/components/schemas/Perfil'
      example:
        id: 4f1c2a9e-8b7d-4c3a-9e2f-1a2b3c4d5e6f
        nome: João Silva
        email: joao.silva@ufms.br
        perfis: [participante]
    UsuarioRegistrado:
      type: object
      required: [id, nome, email, desativado]
      properties:
        id:
          type: string
          description: Identificador do usuário.
        nome:
          type: string
          description: Nome; vazio se não informado.
        email:
          type: string
          description: E-mail; vazio se não informado.
        desativado:
          type: boolean
          description: Se o acesso ao FACOFFEE está desativado.
      example:
        id: 4f1c2a9e-8b7d-4c3a-9e2f-1a2b3c4d5e6f
        nome: João Silva
        email: joao.silva@ufms.br
        desativado: false
