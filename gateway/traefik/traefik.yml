# Static configuration. Routes and middlewares live in dynamic.yml.
entryPoints:
  # Plain HTTP for the local environment (ADR 0022): routers without entryPoints answer on both.
  http:
    address: ":80"
  websecure:
    address: ":443"
    http:
      # shortcut: Traefik's self-signed default certificate, configure ACME or the university certificate before production
      tls: {}

providers:
  file:
    filename: /etc/traefik/dynamic.yml

ping: {}

accessLog: {}
