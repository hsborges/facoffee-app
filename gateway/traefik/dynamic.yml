http:
  routers:
    # The contatos are internal to Notificação (ADR 0019): without a router it answers 404.
    usuario:
      rule: (Path(`/api/usuario`) || PathPrefix(`/api/usuario/`)) && !Path(`/api/usuario/contato`) && !PathPrefix(`/api/usuario/contato/`)
      middlewares: [auth, acesso, strip-api-prefix]
      service: usuario
    # The agendador's triggers are internal (ADR 0017): without a router they answer 404.
    participacao:
      rule: (Path(`/api/participacao`) || PathPrefix(`/api/participacao/`)) && !Path(`/api/participacao/iniciar-ano`) && !Path(`/api/participacao/iniciar-mes`)
      middlewares: [auth, acesso, strip-api-prefix]
      service: participacao
    financeiro:
      rule: Path(`/api/financeiro`) || PathPrefix(`/api/financeiro/`)
      middlewares: [auth, acesso, strip-api-prefix]
      service: financeiro
    # Public on purpose: the browser loads the page before having a token (ADR 0009).
    docs:
      rule: Path(`/docs`) || PathPrefix(`/docs/`)
      service: docs

  middlewares:
    auth:
      forwardAuth:
        address: http://gateway-auth:3000/verify
        # Replaces any value sent by the client.
        authResponseHeaders: [X-User-Id, X-User-Roles, X-User-Name, X-User-Email]
    # Runs after auth, with its X-User-Id: 403 for a deactivated access (ADR 0011).
    acesso:
      forwardAuth:
        address: http://usuario:3000/acesso
    strip-api-prefix:
      stripPrefixRegex:
        regex: ["^/api/[a-z]+"]

  services:
    usuario:
      loadBalancer:
        servers: [{ url: http://usuario:3000 }]
    participacao:
      loadBalancer:
        servers: [{ url: http://participacao:3000 }]
    financeiro:
      loadBalancer:
        servers: [{ url: http://financeiro:3000 }]
    docs:
      loadBalancer:
        servers: [{ url: http://docs:8080 }]
