name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Starts and removes the stack with Testcontainers (infra/docker-compose.test.yml).
      - run: pnpm test:e2e
      - name: Traces do Playwright e logs do compose
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: test-results/
