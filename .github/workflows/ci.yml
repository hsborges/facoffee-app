name: ci

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Contratos de eventos
        run: pnpm --filter @facoffee/contracts test
      - name: Testes dos scripts da raiz
        run: pnpm exec vitest run scripts
      # Workspaces mudados desde main e os que dependem deles; mudança na configuração da raiz afeta todos.
      - name: Workspaces afetados
        run: |
          if git diff --quiet origin/main... -- package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json; then
            echo "AFETADOS=...[origin/main]" >> "$GITHUB_ENV"
          else
            echo "AFETADOS=*" >> "$GITHUB_ENV"
          fi
      - run: pnpm --filter "$AFETADOS" --filter '!facoffee' test
      - run: pnpm --filter "$AFETADOS" --filter '!facoffee' build
